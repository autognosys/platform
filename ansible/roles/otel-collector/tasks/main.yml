---
- name: Check if otelcol is already installed
  stat:
    path: /usr/bin/otelcol-contrib
  register: otelcol_binary

- name: Set OTel Collector version
  set_fact:
    otelcol_version: "0.152.0"

- name: Download OTel Collector contrib
  get_url:
    url: "https://github.com/open-telemetry/opentelemetry-collector-releases/releases/download/v{{ otelcol_version }}/otelcol-contrib_{{ otelcol_version }}_linux_amd64.deb"
    dest: /tmp/otelcol-contrib.deb
    mode: '0644'
  when: not otelcol_binary.stat.exists

- name: Install OTel Collector
  apt:
    deb: /tmp/otelcol-contrib.deb
  when: not otelcol_binary.stat.exists

- name: Deploy OTel Collector config
  template:
    src: otelcol-config.yml.j2
    dest: /etc/otelcol-contrib/config.yaml
    owner: root
    group: root
    mode: '0644'
  notify: Restart OTel Collector

# The OpenObserve credentials reach the collector as an environment variable
# (OPENOBSERVE_BASIC_AUTH), written to this file at boot by autognosys-boot.sh.
- name: Create OTel Collector systemd drop-in directory
  file:
    path: /etc/systemd/system/otelcol-contrib.service.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Install OTel Collector credentials drop-in
  copy:
    src: 10-openobserve.conf
    dest: /etc/systemd/system/otelcol-contrib.service.d/10-openobserve.conf
    owner: root
    group: root
    mode: '0644'

- name: Enable and start OTel Collector
  systemd:
    name: otelcol-contrib
    enabled: true
    state: "{{ service_state }}"
    daemon_reload: true
