- name: Check running pm2 processes
  command: pm2 jlist
  become: true
  become_user: ubuntu
  register: pm2_processes
  changed_when: false

- name: Start website process
  command: pm2 start npm --name website -- start
  args:
    chdir: /app/platform/website
  become: true
  become_user: ubuntu
  when: "'website' not in pm2_processes.stdout"

- name: Start api process
  command: >
    pm2 start "uv run uvicorn main:app --host 0.0.0.0 --port 8000"
    --name api
  args:
    chdir: /app/platform/backend
  become: true
  become_user: ubuntu
  when: "'\"name\":\"api\"' not in pm2_processes.stdout"

- name: Save pm2 process list
  command: pm2 save
  become: true
  become_user: ubuntu
  changed_when: false

# Installs the unit directly instead of running `pm2 startup`, which only prints
# a command to run as root when invoked as a normal user.
- name: Install PM2 resurrect script
  copy:
    src: pm2-start.sh
    dest: /home/ubuntu/pm2-start.sh
    owner: ubuntu
    group: ubuntu
    mode: '0755'

- name: Install PM2 systemd unit
  template:
    src: pm2-ubuntu.service.j2
    dest: /etc/systemd/system/pm2-ubuntu.service
    owner: root
    group: root
    mode: '0644'
  notify: reload systemd

- name: Enable PM2 on boot
  systemd:
    name: pm2-ubuntu
    enabled: true
    daemon_reload: true
