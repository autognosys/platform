name: Deploy - Ansible

# Manual only. VM configuration is now baked into the Packer image
# (packer/autognosys-base.pkr.hcl) and applied at boot by autognosys-boot.sh.
# Running this playbook against a live VM would rewrite the OpenObserve and
# OTel units before their secret env files exist, so it no longer auto-runs.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Ansible
        run: pip install ansible

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan ${{ secrets.VM_HOST }} >> ~/.ssh/known_hosts

      - name: Run Ansible playbook
        run: |
          cd ansible
          ansible-playbook -i inventory/hosts.yml site.yml
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
